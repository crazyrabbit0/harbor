[package]
name = "harbor-shared"
version = "0.0.0"
edition = "2021"
publish = false

[features]
mpv = ["dep:libmpv2", "dep:libmpv2-sys", "dep:ts-rs"]

[dependencies]
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tokio = { version = "1", features = ["full"] }
libmpv2 = { version = "4", optional = true }
libmpv2-sys = { version = "4", optional = true }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
futures-util = "0.3"
